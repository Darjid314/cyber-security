name: Scrape Cybersecurity Tenders

on:
  workflow_dispatch: # Phone se manual run button ke liye
  schedule:
    - cron: '0 */6 * * *' # Har 6 ghante mein auto-check karega (optional)

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4 gspread oauth2client

      - name: Execute Scraper
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python scraper.py
